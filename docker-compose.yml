version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vision_attendance_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=prod-ai-attendance-secret-key-super-secure-2026
      - JWT_SECRET_KEY=jwt-attendance-auth-token-secret-key-9988
      - DATABASE_URL=postgresql://attendance_user:attendance_pass@postgres:5432/attendance_db
      - FACE_MATCH_THRESHOLD=0.62
      - LIVENESS_BLUR_THRESHOLD=85.0
    volumes:
      - attendance_data:/app/Attendance
      - biometric_data:/app/TrainingImageLabel
      - reports_data:/app/Reports
      - audit_data:/app/AuditLogs
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: vision_attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  attendance_data:
  biometric_data:
  reports_data:
  audit_data:
